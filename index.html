<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;font-family:Arial,sans-serif}
body{color:white}
#menu{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at center,#252525,#030303);
}
.panel{
  width:min(760px,92vw);padding:46px 42px;text-align:center;
  background:rgba(0,0,0,.90);border:1px solid rgba(255,255,255,.12);
  border-radius:26px;box-shadow:0 0 90px rgba(255,143,199,.12)
}

.sub{color:#ff8fc7;font-size:20px;margin-bottom:30px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
button{
  padding:18px 14px;border:0;border-radius:14px;background:#fff;color:#111;
  font-size:18px;font-weight:bold;cursor:pointer;transition:.15s;min-height:90px
}
button:hover{transform:scale(1.04);background:#ff8fc7}
button small{display:block;font-size:12px;margin-top:7px;font-weight:normal;opacity:.7}
.info{margin-top:24px;color:#aaa;font-size:13px;line-height:1.7}
#gameWrap{position:fixed;inset:0;display:none;background:#000}
#gameFrame{width:100%;height:100%;border:0;display:block}
#backButton{
  position:fixed;z-index:999999;right:18px;top:18px;display:none;
  min-height:0;padding:10px 16px;font-size:14px;background:rgba(255,255,255,.9)
}
@media(max-width:650px){.modes{grid-template-columns:1fr}h1{font-size:36px}.panel{padding:34px 22px}}
</style>

function decodeBase64(str) {
  const bytes = Uint8Array.from(atob(str), c => c.charCodeAt(0));
  return new TextDecoder("utf-8").decode(bytes);
}

function startMode(mode) {
  let source = decodeBase64(GAME_SOURCES[mode]);

  // Make each original program independent of karby2.png.
  source = source.replace(/["']karby2\.png["']/g, JSON.stringify(KIRBY_IMAGE));

  document.getElementById("menu").style.display = "none";
  document.getElementById("gameWrap").style.display = "block";
  document.getElementById("backButton").style.display = "block";

  const frame = document.getElementById("gameFrame");
  frame.srcdoc = source;
}

function backToMenu() {
  const frame = document.getElementById("gameFrame");
  frame.srcdoc = "";
  document.getElementById("gameWrap").style.display = "none";
  document.getElementById("backButton").style.display = "none";
  document.getElementById("menu").style.display = "flex";
}
